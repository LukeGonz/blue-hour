<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 224 240" fill="none">
  <style>
    @keyframes drawCW {
      from { stroke-dashoffset: var(--len); }
      to   { stroke-dashoffset: 0; }
    }
    @keyframes drawCCW {
      from { stroke-dashoffset: calc(-1 * var(--len)); }
      to   { stroke-dashoffset: 0; }
    }
    @keyframes strokeReveal {
      from { stroke-dashoffset: 280; opacity: 0; }
      to   { stroke-dashoffset: 0;   opacity: 1; }
    }
    @keyframes fadeScale {
      from { opacity: 0; transform: scale(0.45); }
      to   { opacity: 1; transform: scale(1); }
    }
    @keyframes tickReveal {
      from { opacity: 0; transform: scaleY(0); }
      to   { opacity: 1; transform: scaleY(1); }
    }
    @keyframes breathe {
      0%, 100% { opacity: 0.65; }
      50%      { opacity: 1; }
    }

    .r1 {
      --len: 547;
      stroke-dasharray: 480 67;
      stroke-dashoffset: 547;
      animation: drawCW 2s cubic-bezier(0.4, 0, 0.15, 1) 0.1s forwards;
    }
    .r2 {
      --len: 427;
      stroke-dasharray: 380 47;
      stroke-dashoffset: -427;
      animation: drawCCW 1.7s cubic-bezier(0.4, 0, 0.15, 1) 0.35s forwards;
    }
    .r3 {
      --len: 314;
      stroke-dasharray: 280 34;
      stroke-dashoffset: 314;
      animation: drawCW 1.4s cubic-bezier(0.4, 0, 0.15, 1) 0.6s forwards;
    }
    .r4 {
      --len: 207;
      stroke-dasharray: 3 7;
      stroke-dashoffset: 207;
      animation: drawCW 1.1s cubic-bezier(0.4, 0, 0.15, 1) 0.85s forwards;
    }
    .g-path {
      stroke-dasharray: 280;
      stroke-dashoffset: 280;
      opacity: 0;
      animation: strokeReveal 1.1s cubic-bezier(0.4, 0, 0.15, 1) 1.3s forwards;
    }
    .node-halo {
      opacity: 0;
      transform-origin: 112px 33px;
      animation: fadeScale 0.5s cubic-bezier(0.4, 0, 0.15, 1) 1.85s forwards,
                 breathe 3.2s ease 2.4s infinite;
    }
    .node-ring {
      opacity: 0;
      transform-origin: 112px 33px;
      animation: fadeScale 0.4s cubic-bezier(0.4, 0, 0.15, 1) 1.9s forwards;
    }
    .node-fill {
      opacity: 0;
      transform-origin: 112px 33px;
      animation: fadeScale 0.4s cubic-bezier(0.4, 0, 0.15, 1) 1.9s forwards;
    }
    .node-core {
      opacity: 0;
      transform-origin: 112px 33px;
      animation: fadeScale 0.3s cubic-bezier(0.4, 0, 0.15, 1) 2.0s forwards;
    }
    .tk-maj {
      opacity: 0;
      transform-origin: center;
      animation: tickReveal 0.25s cubic-bezier(0.4, 0, 0.2, 1) forwards;
    }
    .tk-min {
      opacity: 0;
      transform-origin: center;
      animation: tickReveal 0.2s cubic-bezier(0.4, 0, 0.2, 1) forwards;
    }
  </style>

  <defs>
    <radialGradient id="ambGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#c9a23a" stop-opacity="0.15"/>
      <stop offset="55%"  stop-color="#c9a23a" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#c9a23a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nodeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#c9a23a" stop-opacity="1.0"/>
      <stop offset="100%" stop-color="#c9a23a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <circle cx="112" cy="120" r="102" fill="url(#ambGlow)"/>

  <circle class="r1" cx="112" cy="120" r="87"
    stroke="#c9a23a" stroke-width="1.5" stroke-linecap="round"/>

  <line class="tk-maj" x1="112" y1="33" x2="112" y2="45"
    stroke="#c9a23a" stroke-width="1.3" stroke-linecap="round" style="animation-delay:2.05s"/>
  <line class="tk-maj" x1="199" y1="120" x2="187" y2="120"
    stroke="#c9a23a" stroke-width="1.3" stroke-linecap="round" style="animation-delay:2.1s"/>
  <line class="tk-maj" x1="112" y1="207" x2="112" y2="195"
    stroke="#c9a23a" stroke-width="1.3" stroke-linecap="round" style="animation-delay:2.15s"/>
  <line class="tk-maj" x1="25" y1="120" x2="37" y2="120"
    stroke="#c9a23a" stroke-width="1.3" stroke-linecap="round" style="animation-delay:2.2s"/>

  <line class="tk-min" x1="155.5" y1="44.66" x2="150.65" y2="53.3"
    stroke="rgba(201,162,58,0.45)" stroke-width="0.9" stroke-linecap="round" style="animation-delay:2.25s"/>
  <line class="tk-min" x1="187.34" y1="76.5" x2="178.7" y2="81.5"
    stroke="rgba(201,162,58,0.45)" stroke-width="0.9" stroke-linecap="round" style="animation-delay:2.3s"/>
  <line class="tk-min" x1="187.34" y1="163.5" x2="178.7" y2="158.5"
    stroke="rgba(201,162,58,0.45)" stroke-width="0.9" stroke-linecap="round" style="animation-delay:2.35s"/>
  <line class="tk-min" x1="155.5" y1="195.34" x2="150.65" y2="186.7"
    stroke="rgba(201,162,58,0.45)" stroke-width="0.9" stroke-linecap="round" style="animation-delay:2.4s"/>
  <line class="tk-min" x1="68.5" y1="195.34" x2="73.35" y2="186.7"
    stroke="rgba(201,162,58,0.45)" stroke-width="0.9" stroke-linecap="round" style="animation-delay:2.45s"/>
  <line class="tk-min" x1="36.66" y1="163.5" x2="45.3" y2="158.5"
    stroke="rgba(201,162,58,0.45)" stroke-width="0.9" stroke-linecap="round" style="animation-delay:2.5s"/>
  <line class="tk-min" x1="36.66" y1="76.5" x2="45.3" y2="81.5"
    stroke="rgba(201,162,58,0.45)" stroke-width="0.9" stroke-linecap="round" style="animation-delay:2.55s"/>
  <line class="tk-min" x1="68.5" y1="44.66" x2="73.35" y2="53.3"
    stroke="rgba(201,162,58,0.45)" stroke-width="0.9" stroke-linecap="round" style="animation-delay:2.6s"/>

  <circle class="r2" cx="112" cy="120" r="68"
    stroke="rgba(196,191,180,0.28)" stroke-width="0.9" stroke-linecap="round"/>
  <circle class="r3" cx="112" cy="120" r="50"
    stroke="rgba(196,191,180,0.14)" stroke-width="0.7" stroke-linecap="round"/>
  <circle class="r4" cx="112" cy="120" r="33"
    stroke="rgba(196,191,180,0.09)" stroke-width="0.5"/>

  <circle class="node-halo" cx="112" cy="33" r="20" fill="url(#nodeGlow)"/>
  <circle class="node-ring" cx="112" cy="33" r="8"
    stroke="rgba(201,162,58,0.3)" stroke-width="0.7" fill="none"/>
  <circle class="node-fill" cx="112" cy="33" r="4.5" fill="#c9a23a"/>
  <circle class="node-core" cx="112" cy="33" r="1.8" fill="#1a1814"/>

  <path class="g-path"
    d="M 112 72 A 48 48 0 1 0 154 144 L 154 120 L 128 120"
    stroke="#f0ebe0" stroke-width="2.6"
    stroke-linecap="round" stroke-linejoin="round"
    fill="none"/>
</svg>
